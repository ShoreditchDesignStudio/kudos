name: Backup Database

# Weekly logical backup of the wins table, kept as a workflow artifact.
#
# Neon's free tier retains only 6 hours of branch history
# (history_retention_seconds = 21600), so point-in-time restore cannot
# recover anything older than that. A weekly dump is the real safety net.
#
# Runs Friday 02:00 UTC — after Thursday's digest week has closed, so each
# dump contains a complete week.
#
# Requires repo secret: DATABASE_URL (the Neon connection string).

on:
  schedule:
    - cron: "0 2 * * 5"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Neon runs Postgres 18. pg_dump refuses to dump a server newer than
      # itself ("aborting because of server version mismatch"), and the
      # runner's default postgresql-client lags behind, so pull the matching
      # major from the PGDG apt repo rather than relying on the image.
      - name: Install postgresql-client-18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # Debian's /usr/bin/pg_dump is the pg_wrapper symlink, which still
          # resolves to the older major even once 18 is installed. Put the
          # real 18 binaries first on PATH.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Dump wins table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump --version
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::DATABASE_URL must be set as a repo secret"
            exit 1
          fi
          pg_dump "$DATABASE_URL" \
            --table=wins --no-owner --no-privileges \
            > "kudos-$(date +%F).sql"
          echo "rows in dump: $(grep -c '^[0-9a-f]\{8\}-' "kudos-$(date +%F).sql" || true)"
          ls -la kudos-*.sql

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kudos-db-backup
          path: kudos-*.sql
          retention-days: 90
